<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tidings of Blossoms over the Glacier</title>
<meta name="description" content="A crocheted cowl that is a Klein bottle: how it is made, and the piece from every side.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20">
</head>
<body>
<button class="lang" id="lang" type="button" data-i18n="switchTo">中文</button>
<header class="hero">
  <div class="hero-text">
    <h1 data-i18n="title">Tidings of Blossoms over the Glacier</h1>
    <p class="alt-title" data-i18n="altTitle">冰河花信</p>
    <p class="lede" data-i18n="lede"></p>
    <p class="meta" data-i18n="meta"></p>
  </div>
  <figure class="hero-photo"><img src="img/tidings_1_round.jpg" data-i18n-alt="heroAlt" alt="" width="1200" height="1600"></figure>
</header>

<main>
<section id="build">
  <h2 data-i18n="buildH"></h2>
  <p class="intro" data-i18n="buildIntro"></p>
  <div class="stage">
    <div class="viewer" id="viewer">
      <canvas id="cv"></canvas>
      <div class="labels" id="labels"></div>
      <p class="sub" id="sub" aria-live="polite"></p>
      <div class="loading" id="loading" data-i18n="loading"></div>
    </div>
    <aside class="panel">
      <ol class="steps" id="steps">
        <li data-seg="0"><b>1</b><span data-i18n="step0"></span></li>
        <li data-seg="1"><b>2</b><span data-i18n="step1"></span></li>
        <li data-seg="2"><b>3</b><span data-i18n="step2"></span></li>
        <li data-seg="3"><b>9</b><span data-i18n="step3"></span></li>
        <li data-seg="4"><b>…</b><span data-i18n="step4"></span></li>
        <li data-seg="5"><b>✓</b><span data-i18n="step5"></span></li>
      </ol>
      <p class="caption" id="caption"></p>
      <div class="controls">
        <button id="play" type="button"></button>
        <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Timeline">
        <select id="rate" aria-label="Speed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select>
      </div>
      <div class="toggles">
        <label><input type="checkbox" id="tSurf" checked> <span data-i18n="tSurf"></span></label>
        <label><input type="checkbox" id="tDbl"> <span data-i18n="tDbl"></span></label>
        <label><input type="checkbox" id="tFollow" checked> <span data-i18n="tFollow"></span></label>
        <label><input type="checkbox" id="tSpin" checked> <span data-i18n="tSpin"></span></label>
      </div>
      <div class="views">
        <span data-i18n="view"></span>
        <button type="button" data-view="oblique" data-i18n="vOblique"></button>
        <button type="button" data-view="top" data-i18n="vTop"></button>
        <button type="button" data-view="side" data-i18n="vSide"></button>
      </div>
    </aside>
  </div>
</section>

<section id="photos">
  <h2 data-i18n="photosH"></h2>
  <div class="gallery">
    <figure><img src="img/tidings_1_round.jpg" data-i18n-alt="cap1" alt="" loading="lazy" width="1200" height="1600"><figcaption data-i18n="cap1"></figcaption></figure>
    <figure><img src="img/tidings_2_triangular.jpg" data-i18n-alt="cap2" alt="" loading="lazy" width="1200" height="1600"><figcaption data-i18n="cap2"></figcaption></figure>
    <figure><img src="img/tidings_4_on_a_model.jpg" data-i18n-alt="cap3" alt="" loading="lazy" width="1200" height="1600"><figcaption data-i18n="cap3"></figcaption></figure>
  </div>
</section>

<section id="math" class="prose">
  <h2 data-i18n="mathH"></h2>
  <div id="mathBody"></div>
</section>
</main>

<footer>
  <p data-i18n="footer"></p>
</footer>

<script src="vendor/three.min.js?v=20"></script>
<script src="vendor/OrbitControls.js?v=20"></script>
<script src="i18n.js?v=20"></script>
<script src="data.js?v=20"></script>
<script src="yarn.js?v=20"></script>
<script src="app.js?v=20"></script>
</body>
</html>
